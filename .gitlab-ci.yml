image: exherbo/exherbo_ci

variables:
  REPO: exheres
  REPO_NAMESPACE: diodonfrost
  PALUDIS_REPO: diodonfrost

stages:
  - test
  - maintenance

build:
  stage: test
  before_script:
    # This repository is not listed in ::unavailable-unofficial yet, so give
    # buildtest a local index entry to enable it from. Drop this once the
    # repository is officially registered. The CleverCloud dependency is only
    # needed while the master branch still declares it in layout.conf.
    - |
      mkdir -p /tmp/local-index
      cat > /tmp/local-index/diodonfrost.repository <<EOF
      format = unavailable-2
      repo_format = e
      sync = git+https://gitlab.exherbo.org/diodonfrost/exheres.git
      dependencies = repository/arbor, repository/CleverCloud
      repo_name = diodonfrost
      homepage = https://gitlab.exherbo.org/diodonfrost/exheres
      description = diodonfrost's Exherbo packages
      EOF
      cat > /etc/paludis/repositories/local-index.conf <<EOF
      format = unavailable
      name = local-index
      location = /tmp/local-index
      importance = -100
      EOF
  script:
    - buildtest

version-check:
  stage: maintenance
  image: python:3.13
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - bash ci/version-check.sh
